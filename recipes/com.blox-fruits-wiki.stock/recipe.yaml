format: 2
id: com.blox-fruits-wiki.stock
version: 4
name: Blox Fruit Stock
description: Current Normal and Mirage Dealer stock in Blox Fruits.
params: {}
fetch:
  url: https://blox-fruits-wiki.com/wiki/stock/
  allow:
  - blox-fruits-wiki.com
  wait: '#current-stock div:has(> a[href^=''/wiki/''] > img)'
fields:
  fruit: a:not(:has(img))
  price: span:has(img[alt='Money'])
columns:
- dealer
- fruit
- price
limit: 20
rows:
- sel: '#current-stock div:has(> a[href^=''/wiki/''] > img)'
  values:
    dealer: Normal
- sel: '#current-mirage-stock div:has(> a[href^=''/wiki/''] > img)'
  values:
    dealer: Mirage
key: fruit
title: Blox Stock
link: https://blox-fruits-wiki.com/wiki/stock/
