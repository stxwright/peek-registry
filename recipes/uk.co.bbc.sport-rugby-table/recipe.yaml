format: 2
id: uk.co.bbc.sport-rugby-table
version: 2
name: Rugby Table
description: League table for a BBC Sport rugby union competition.
params:
  competition:
    default: english-premiership
    options:
    - value: english-premiership
      label: English Premiership
    - value: six-nations
      label: Six Nations
    - value: top-14
      label: Top 14
    - value: pro-tournament
      label: United Rugby Championship
    - value: super-rugby
      label: Super Rugby
    - value: the-english-championship
      label: English Championship
    - value: rugby-championship
      label: The Rugby Championship
    - value: english-national-league-one
      label: National League 1
    help: Competition slug from BBC Sport rugby table URLs (all eight
      verified live). Nations Championship excluded (two hemisphere
      tables); World Cup is event-only.
fetch:
  url: https://www.bbc.co.uk/sport/rugby-union/{competition}/table
  allow:
  - www.bbc.co.uk
fields:
  comp:
    sel: h1
    scope: page
  team: td:nth-child(2)
  played: td:nth-child(3) span[aria-hidden]
  won: td:nth-child(5) span[aria-hidden]
  lost: td:nth-child(7) span[aria-hidden]
  points: td:nth-child(15) span[aria-hidden]
columns:
- team
- played
- won
- lost
- points
limit: 16
rows: table tbody tr
key: team
title: '{comp}'
link: https://www.bbc.co.uk/sport/rugby-union/{competition}/table
