format: 2
id: uk.co.bbc.sport-cricket-table
version: 2
name: Cricket Table
description: County Championship table from BBC Sport.
params:
  competition:
    default: mens-england-division-one-multi-day
    options:
    - value: mens-england-division-one-multi-day
      label: County Championship Div 1
    - value: mens-england-division-two-multi-day
      label: County Championship Div 2
    - value: mens-england-the-hundred
      label: The Hundred Men
    - value: womens-england-the-hundred
      label: The Hundred Women
    - value: mens-england-twenty20
      label: T20 Blast Men
    - value: womens-england-twenty20
      label: T20 Blast Women
    - value: mens-england-one-day
      label: One Day Cup Men
    - value: womens-england-one-day
      label: One Day Cup Women
    - value: womens-england-tier-two-one-day
      label: One Day Cup Women League 2
    help: Competition slug from BBC Sport cricket table URLs (all nine
      verified live). Short-format tables show ties under Drawn. Blast
      and One Day Cup group-stage tables are not listed.
fetch:
  url: https://www.bbc.co.uk/sport/cricket/{competition}/table
  allow:
  - www.bbc.co.uk
fields:
  comp:
    sel: h1
    scope: page
  team: td:nth-child(2)
  played: td:nth-child(3)
  won: td:nth-child(5)
  drawn: td:nth-child(9)
  points: td:nth-child(15)
columns:
- team
- played
- won
- drawn
- points
limit: 10
rows: table[data-testid='sport-table'] tbody tr
key: team
title: '{comp}'
link: https://www.bbc.co.uk/sport/cricket/{competition}/table
