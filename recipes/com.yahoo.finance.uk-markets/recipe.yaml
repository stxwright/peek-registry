format: 2
id: com.yahoo.finance.uk-markets
version: 8
name: Yahoo Finance UK Markets
description: Live UK market indices and currency exchange rates.
fetch:
  url: "https://uk.finance.yahoo.com/"
  allow: ["uk.finance.yahoo.com"]
  every: 900
  wait: "fin-streamer[data-symbol='^FTSE']"
rows: "[data-testid='ticker-list-item']:has(fin-streamer[data-symbol='^FTSE']), [data-testid='ticker-list-item']:has(fin-streamer[data-symbol='^FTMC']), [data-testid='ticker-list-item']:has(fin-streamer[data-symbol='GBPUSD=X']), [data-testid='ticker-list-item']:has(fin-streamer[data-symbol='GBPEUR=X'])"
fields:
  ticker: { sel: "fin-streamer[data-field='regularMarketPrice']", attr: "data-symbol" }
  price: "fin-streamer[data-field='regularMarketPrice']"
  change: "fin-streamer[data-field='regularMarketChangePercent']"
key: price
limit: 4
title: "UK Markets"
columns: [ticker, price, change]
link: "https://uk.finance.yahoo.com/"
