format: 2
id: uk.co.bbc.sport-football-table
version: 3
name: Football Table
description: League table for a BBC Sport football competition.
params:
  competition:
    default: premier-league
    options:
    - value: premier-league
      label: Premier League
    - value: scottish-premiership
      label: Scottish Premiership
    - value: championship
      label: Championship
    - value: womens-super-league
      label: Women's Super League
    - value: league-one
      label: League One
    - value: league-two
      label: League Two
    help: Competition slug from BBC Sport football table URLs (all six
      verified live).
fetch:
  url: https://www.bbc.co.uk/sport/football/{competition}/table
  allow:
  - www.bbc.co.uk
  wait: table[data-testid='football-table']
fields:
  comp:
    sel: h1
    scope: page
  team: td[aria-label='Team']
  played: td[aria-label='Played']
  gd: td[aria-label='Goal Difference']
  points: td[aria-label='Points']
columns:
- team
- played
- gd
- points
limit: 20
rows: table[data-testid='football-table'] tbody tr
key: team
title: '{comp}'
link: https://www.bbc.co.uk/sport/football/{competition}/table
